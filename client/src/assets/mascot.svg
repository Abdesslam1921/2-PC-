<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#0b5d57" />
    </linearGradient>
    <radialGradient id="visorGrad" x1="0.3" y1="0.2" x2="0.8" y2="1">
      <stop offset="0" stop-color="#123338" />
      <stop offset="1" stop-color="#06171a" />
    </radialGradient>
  </defs>

  <!-- antenna -->
  <line x1="60" y1="14" x2="60" y2="26" stroke="#f97316" stroke-width="4" stroke-linecap="round" />
  <circle cx="60" cy="12" r="7" fill="#f97316" />

  <!-- body / head -->
  <rect x="22" y="24" width="76" height="72" rx="30" fill="url(#bodyGrad)" />

  <!-- visor -->
  <rect x="34" y="42" width="52" height="34" rx="17" fill="url(#visorGrad)" />

  <!-- eyes -->
  <circle cx="49" cy="59" r="6.5" fill="#5eead4" />
  <circle cx="71" cy="59" r="6.5" fill="#5eead4" />
  <circle cx="50.5" cy="57.5" r="2" fill="#ffffff" />
  <circle cx="72.5" cy="57.5" r="2" fill="#ffffff" />

  <!-- smile -->
  <path d="M52 71 q8 6 16 0" stroke="#5eead4" stroke-width="2.6" fill="none" stroke-linecap="round" />

  <!-- side ears -->
  <rect x="14" y="50" width="9" height="22" rx="4.5" fill="#0b5d57" />
  <rect x="97" y="50" width="9" height="22" rx="4.5" fill="#0b5d57" />
</svg>
